<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"></stop>
      <stop offset="100%" stop-color="#1E3A8A"></stop>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"></stop>
      <stop offset="100%" stop-color="#60A5FA"></stop>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"></feDropShadow>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"></rect>

  <!-- Decorative Grid -->
  <g opacity="0.08" stroke="#FFFFFF">
    <path d="M0 80H1280"></path>
    <path d="M0 160H1280"></path>
    <path d="M0 240H1280"></path>
    <path d="M0 320H1280"></path>
    <path d="M0 400H1280"></path>
    <path d="M0 480H1280"></path>
    <path d="M0 560H1280"></path>

    <path d="M160 0V640"></path>
    <path d="M320 0V640"></path>
    <path d="M480 0V640"></path>
    <path d="M640 0V640"></path>
    <path d="M800 0V640"></path>
    <path d="M960 0V640"></path>
    <path d="M1120 0V640"></path>
  </g>

  <!-- Hexagon -->
  <polygon points="960,140 1080,210 1080,350 960,420 840,350 840,210" fill="url(#accent)" filter="url(#shadow)"></polygon>

  <!-- C -->
  <text x="960" y="330" text-anchor="middle" font-size="170" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" fill="#FFFFFF">
    C
  </text>

  <!-- Title -->
  <text x="90" y="220" font-size="74" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" fill="#FFFFFF">
    C Programming
  </text>

  <!-- Subtitle -->
  <text x="90" y="280" font-size="28" font-family="Segoe UI, Inter, Arial, sans-serif" fill="#CBD5E1">
    From Fundamentals to Systems Programming
  </text>

  <!-- Bottom line -->
  <rect x="90" y="330" width="420" height="6" rx="3" fill="#3B82F6"></rect>

  <!-- Code -->
  <g font-family="Consolas, Monaco, monospace" font-size="22" fill="#94A3B8">

    <text x="90" y="430">int main(void)</text>
    <text x="90" y="465">{</text>
    <text x="130" y="500">printf("Hello, World!\n");</text>
    <text x="130" y="535">return 0;</text>
    <text x="90" y="570">}</text>

  </g>

</svg>